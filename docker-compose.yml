services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override localhost URLs with container service names
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/saas_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333    # qdrant is provided by docker-compose.infra.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai-net    # join the shared ai-net so api can reach qdrant / minio
    volumes:
      - ./uploads:/tmp/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_APP_ENV: development
    depends_on:
      - api
    networks:
      - ai-net

volumes:
  pgdata:
  redisdata:

networks:
  ai-net:
    external: true   # declared in docker-compose.infra.yml
    name: ai-net
