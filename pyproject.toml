[project]
name = "saas-platform"
version = "1.0.0"
description = "Multi-tenant SaaS Platform API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & config
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Cache / queues
    "redis[hiredis]>=5.2.0",
    "celery[redis]>=5.4.0",
    # Auth & security
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "pyotp>=2.9.0",
    # Storage
    "aioboto3>=13.0.0",
    # Logging
    "structlog>=24.4.0",
    # HTTP client
    "httpx>=0.28.0",
    # Utilities
    "python-slugify>=8.0.4",
    "authlib>=1.6.8",
    "stripe>=14.4.0",
    "python-magic>=0.4.27",
    "prometheus-client>=0.24.1",
    "websockets>=16.0",
    "numpy>=2.4.2",
    # RAG / knowledge base
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "pymupdf>=1.24.0",       # PDF text extraction (fitz)
    "python-docx>=1.1.0",    # DOCX extraction
    "html2text>=2024.2.26",  # URL → Markdown text
    "youtube-transcript-api>=0.6.2",  # YouTube transcript ingestion
    "sse-starlette>=3.3.2",
    "twilio>=9.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "coverage>=7.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "locust>=2.43.3",
    "numpy>=2.4.2",
    "websockets>=16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
